name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースタグ名 (例: v1.0.0)'
        required: true

permissions:
  contents: write

env:
  PROJECT: src/SendClipboard.csproj
  OUTPUT_DIR: publish

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: ver
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ github.event.inputs.tag }}' } else { '${{ github.ref_name }}' }
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+(\.\d+){0,3}(-[0-9A-Za-z.-]+)?$') {
            Write-Error "タグ '$tag' からバージョンを判定できません。v1.2.3 形式で付けてください。"
            exit 1
          }
          "tag=$tag"         >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -p:Version=${{ steps.ver.outputs.version }}
          -o ${{ env.OUTPUT_DIR }}

      - name: Create ZIP
        id: zip
        run: |
          $name = "SendClipboard-${{ steps.ver.outputs.tag }}.zip"
          Compress-Archive -Path '${{ env.OUTPUT_DIR }}\*' -DestinationPath $name -Force
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.zip.outputs.name }}
